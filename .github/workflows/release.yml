name: Release

on:
  push:
    tags:
      - "v*"
  workflow_call:
    inputs:
      ref:
        description: Git ref to build (usually a v* tag)
        type: string
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref != '' && inputs.ref || github.ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build macOS app
        run: npm run electron:build -- --publish never

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.ref != '' && inputs.ref || github.ref_name }}
          files: |
            release/*.dmg
            release/*.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
